<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Ramais</title>
<style>
  :root { --fundo:#f4f5f7; --cartao:#fff; --texto:#1d2330; --suave:#667085; --borda:#d9dde4;
          --cor:#0b5cad; --verde:#17803d; --cinza:#98a2b3; --erro:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--fundo); color:var(--texto); }
  header { background:var(--cor); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:8px; padding:20px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  input { padding:8px 10px; border:1px solid var(--borda); border-radius:6px; font:inherit; min-width:0; }
  button { padding:8px 14px; border:1px solid var(--cor); background:var(--cor); color:#fff; border-radius:6px; font:inherit; cursor:pointer; }
  button.leve { background:#fff; color:var(--cor); }
  button.perigo { background:#fff; color:var(--erro); border-color:var(--erro); }
  header button { background:transparent; border-color:#fff; }
  form.linha, .linha { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .linha input { flex:1 1 140px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--borda); }
  th { font-size:12px; text-transform:uppercase; color:var(--suave); }
  td.acoes { text-align:right; white-space:nowrap; }
  .tabela { overflow-x:auto; }
  .ponto { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--cinza); margin-right:6px; }
  .ponto.on { background:var(--verde); }
  .suave { color:var(--suave); font-size:13px; }
  #aviso { padding:10px 14px; border-radius:6px; margin-bottom:16px; display:none; }
  #aviso.erro { display:block; background:#fee4e2; color:var(--erro); }
  #aviso.ok { display:block; background:#dcfae6; color:var(--verde); }
  #estado { display:flex; gap:24px; flex-wrap:wrap; }
  #estado b { display:block; font-size:22px; }
  #tela-login { max-width:340px; margin:80px auto; }
  #tela-login input, #tela-login button { width:100%; margin-top:10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Sistema de Ramais</h1>
  <span id="quem" class="suave" style="color:#fff"></span>
  <button id="sair" hidden>Sair</button>
</header>

<main>
  <div id="aviso"></div>

  <!-- Tela de login -->
  <form id="tela-login" class="cartao" hidden>
    <h2>Entrar</h2>
    <input id="usuario" placeholder="Usuário" autocomplete="username" required>
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button>Entrar</button>
  </form>

  <!-- Tela principal -->
  <div id="tela-app" hidden>
    <div class="cartao"><div id="estado"></div></div>

    <form id="form-ramal" class="cartao" hidden>
      <h2 id="titulo-form">Novo ramal</h2>
      <div class="linha" style="display:flex">
        <input id="numero" placeholder="Número (3 a 5 dígitos)" pattern="\d{3,5}" maxlength="5" required>
        <input id="nome" placeholder="Nome" minlength="2" maxlength="60" required>
        <input id="setor" placeholder="Setor" minlength="2" maxlength="40" required>
        <button id="botao-salvar">Adicionar</button>
        <button type="button" id="cancelar" class="leve" hidden>Cancelar</button>
      </div>
    </form>

    <div class="cartao">
      <div class="linha" style="margin-bottom:12px">
        <h2 style="margin:0; flex:1">Ramais</h2>
        <input id="filtro" placeholder="Buscar por número, nome ou setor">
      </div>
      <div class="tabela">
        <table>
          <thead><tr><th>Ramal</th><th>Nome</th><th>Setor</th><th>Situação</th><th></th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p id="vazio" class="suave" hidden>Nenhum ramal encontrado.</p>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let perfil = null;     // "admin" ou "consulta"
let editando = null;   // número do ramal em edição (null = criando um novo)
let relogio = null;    // temporizador da atualização automática

function avisar(texto, tipo = "erro") {
  $("aviso").textContent = texto;
  $("aviso").className = texto ? tipo : "";
}

// Faz uma chamada à API do painel e devolve o campo "dados" da resposta.
async function api(metodo, caminho, corpo) {
  let resposta;
  try {
    resposta = await fetch(caminho, {
      method: metodo,
      headers: corpo ? {"Content-Type": "application/json"} : {},
      body: corpo ? JSON.stringify(corpo) : undefined,
    });
  } catch (e) {
    throw new Error("Sem comunicação com o painel web.");
  }
  const json = await resposta.json().catch(() => ({}));
  if (resposta.status === 401 && caminho !== "/api/login") mostrarLogin();
  if (!resposta.ok) throw new Error(json.erro || "Erro " + resposta.status);
  return json.dados;
}

function mostrarLogin() {
  clearInterval(relogio);
  $("tela-app").hidden = true;
  $("tela-login").hidden = false;
  $("sair").hidden = true;
  $("quem").textContent = "";
}

function mostrarApp(dados) {
  perfil = dados.perfil;
  sessionStorage.setItem("usuario", JSON.stringify(dados));
  $("tela-login").hidden = true;
  $("tela-app").hidden = false;
  $("sair").hidden = false;
  $("form-ramal").hidden = perfil !== "admin";
  $("quem").textContent = dados.usuario + " (" + perfil + ")";
  atualizar();
  clearInterval(relogio);
  relogio = setInterval(atualizar, 5000);  // mantém online/offline em dia
}

async function atualizar() {
  try {
    const filtro = encodeURIComponent($("filtro").value.trim());
    const [ramais, estado] = await Promise.all([
      api("GET", "/api/ramais?filtro=" + filtro), api("GET", "/api/estado")]);
    desenharEstado(estado);
    desenharLista(ramais);
    if ($("aviso").className === "erro") avisar("");
  } catch (e) { avisar(e.message); }
}

function desenharEstado(e) {
  const itens = [["Ramais", e.ramais], ["Online", e.online], ["Clientes TCP", e.conexoes_tcp],
                 ["Threads", e.threads], ["Heartbeats UDP", e.heartbeats_udp],
                 ["No ar há", Math.floor(e.ativo_ha_s / 60) + " min"]];
  $("estado").replaceChildren(...itens.map(([rotulo, valor]) => {
    const div = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = valor;
    div.append(b, rotulo);
    div.className = "suave";
    return div;
  }));
}

// A tabela é montada com textContent (nunca innerHTML) para que um nome de
// ramal contendo HTML não seja executado pelo navegador (XSS).
function desenharLista(ramais) {
  $("vazio").hidden = ramais.length > 0;
  $("lista").replaceChildren(...ramais.map(r => {
    const tr = document.createElement("tr");
    for (const texto of [r.numero, r.nome, r.setor]) {
      const td = document.createElement("td");
      td.textContent = texto;
      tr.append(td);
    }
    const situacao = document.createElement("td");
    const ponto = document.createElement("span");
    ponto.className = "ponto" + (r.online ? " on" : "");
    situacao.append(ponto, r.online ? "Online (" + r.ip + ")" : "Offline");
    const acoes = document.createElement("td");
    acoes.className = "acoes";
    if (perfil === "admin") {
      const editar = document.createElement("button");
      editar.textContent = "Editar";
      editar.className = "leve";
      editar.onclick = () => comecarEdicao(r);
      const remover = document.createElement("button");
      remover.textContent = "Remover";
      remover.className = "perigo";
      remover.onclick = () => removerRamal(r);
      acoes.append(editar, " ", remover);
    }
    tr.append(situacao, acoes);
    return tr;
  }));
}

function comecarEdicao(r) {
  editando = r.numero;
  $("numero").value = r.numero; $("nome").value = r.nome; $("setor").value = r.setor;
  $("titulo-form").textContent = "Editar ramal " + r.numero;
  $("botao-salvar").textContent = "Salvar";
  $("cancelar").hidden = false;
  $("nome").focus();
}

function limparForm() {
  editando = null;
  $("form-ramal").reset();
  $("titulo-form").textContent = "Novo ramal";
  $("botao-salvar").textContent = "Adicionar";
  $("cancelar").hidden = true;
}

async function removerRamal(r) {
  if (!confirm("Remover o ramal " + r.numero + " (" + r.nome + ")?")) return;
  try {
    await api("DELETE", "/api/ramais/" + encodeURIComponent(r.numero));
    avisar("Ramal " + r.numero + " removido.", "ok");
    if (editando === r.numero) limparForm();
    atualizar();
  } catch (e) { avisar(e.message); }
}

$("tela-login").onsubmit = async ev => {
  ev.preventDefault();
  try {
    const dados = await api("POST", "/api/login", {usuario: $("usuario").value, senha: $("senha").value});
    $("senha").value = "";
    avisar("");
    mostrarApp(dados);
  } catch (e) { avisar(e.message); }
};

$("form-ramal").onsubmit = async ev => {
  ev.preventDefault();
  const corpo = {numero: $("numero").value.trim(), nome: $("nome").value, setor: $("setor").value};
  try {
    if (editando) await api("PUT", "/api/ramais/" + encodeURIComponent(editando), corpo);
    else await api("POST", "/api/ramais", corpo);
    avisar("Ramal " + corpo.numero + " salvo.", "ok");
    limparForm();
    atualizar();
  } catch (e) { avisar(e.message); }
};

$("cancelar").onclick = limparForm;
$("filtro").oninput = atualizar;
$("sair").onclick = async () => {
  await api("POST", "/api/logout").catch(() => {});
  sessionStorage.removeItem("usuario");
  mostrarLogin();
};

// Ao abrir a página: se já havia sessão nesta aba, volta direto para o app.
const salvo = sessionStorage.getItem("usuario");
if (salvo) mostrarApp(JSON.parse(salvo)); else mostrarLogin();
</script>
</body>
</html>
